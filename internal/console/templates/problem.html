{{template "head" .}}
<header class="bar">
  {{if .Brand.HasLogo}}<img src="/brand/logo" alt="" style="height:24px;max-width:120px;object-fit:contain;border-radius:4px;background:#fff;padding:2px">{{else}}<span class="mark" aria-hidden="true">{{.Brand.MarkLetter}}</span>{{end}}
  <span style="font-size:14px;font-weight:600">{{.Brand.ProductName}}</span>
</header>
<main style="max-width:620px;margin:0 auto;padding-top:56px">
  <h1>{{.Title}}</h1>
  {{if .Said}}<p class="sub" style="font-size:14px;line-height:1.55">{{.Said}}</p>{{end}}
  <p style="margin-top:26px"><a href="/signin">Try signing in again</a></p>
</main>
{{template "foot" .}}
