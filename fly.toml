# Fly.io app for the gateway (console, sign-in, sign-up and the device API).
# Edit the two EDIT lines (app name, region), then see deploy/README.md for the order of steps.

app = "vlume-mdm"            # EDIT: must be unique across Fly; `fly apps create` tells you
primary_region = "lhr"       # EDIT: pick the region nearest your database and customers

[build]
  dockerfile = "Dockerfile"

[env]
  MDM_LISTEN = ":8080"
  # Fly's edge terminates TLS and forwards plain HTTP from its private IPv4
  # range. X-Forwarded-For is believed from that range and nobody else. The
  # 6PN range (fdaa::/16) is deliberately NOT trusted: it also carries other
  # apps in the same Fly organisation, and a header believed from them is an
  # address they choose. (assumption, checked after the first deploy: a sign-in
  # in the audit log shows your real address, not a 172.16 one)
  MDM_TRUSTED_PROXIES = "172.16.0.0/12"
  MDM_SIGNUP_HOST = "app.mdm.vlumesec.com"
  MDM_SIGNUP_TENANT_DOMAIN = "mdm.vlumesec.com"   # customers get <name>.mdm.vlumesec.com
  MDM_SIGNUP_PRODUCT_NAME = "Vlume"
  # The owners' console: one hostname, its own sign-in, mandatory authenticator.
  MDM_OPERATOR_HOST = "ops.mdm.vlumesec.com"

[http_service]
  internal_port = 8080
  force_https = true
  # The gateway runs its own timers (notifications, Android sync, weekly
  # reports), so it must never be stopped for being idle.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

# The gateway answers by Host name, so the probe names the operator host, whose
# home page answers 200 without touching a tenant.
[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  timeout = "3s"
  method = "GET"
  path = "/"
  protocol = "http"
  headers = { Host = "app.mdm.vlumesec.com" }

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
